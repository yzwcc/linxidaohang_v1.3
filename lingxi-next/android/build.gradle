// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        def proxy = System.getenv('LINGXI_BUILD_MAVEN_PROXY')
        if (proxy && proxy ==~ /^http:\/\/127\.0\.0\.1:\d+$/) {
            maven { url "$proxy/google"; allowInsecureProtocol = true }
            maven {
                url "$proxy/central"
                allowInsecureProtocol = true
                content {
                    includeGroup 'org.codehaus.groovy'
                    includeGroup 'org.apache.httpcomponents'
                    includeGroup 'org.apache'
                    includeGroup 'org.apache.commons'
                    includeGroup 'commons-logging'
                    includeGroup 'commons-codec'
                }
            }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        def proxy = System.getenv('LINGXI_BUILD_MAVEN_PROXY')
        if (proxy && proxy ==~ /^http:\/\/127\.0\.0\.1:\d+$/) {
            maven { url "$proxy/google"; allowInsecureProtocol = true }
            maven {
                url "$proxy/central"
                allowInsecureProtocol = true
                content {
                    includeGroup 'org.codehaus.groovy'
                    includeGroup 'org.apache.httpcomponents'
                    includeGroup 'org.apache'
                    includeGroup 'org.apache.commons'
                    includeGroup 'commons-logging'
                    includeGroup 'commons-codec'
                }
            }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
